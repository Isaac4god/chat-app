<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Chat App</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .offline-wrap {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }
        .offline-card { max-width: 420px; }
        .offline-mark { font-size: 48px; display: block; margin-bottom: 16px; }
    </style>
</head>
<body class="auth-page">
    <main class="offline-wrap">
        <div class="offline-card">
            <span class="offline-mark" aria-hidden="true">&#128246;</span>
            <h1>You're offline</h1>
            <p class="subtitle">The app could not reach the chat server. Check your connection and try again.</p>
            <p><button type="button" class="submit" onclick="window.location.reload()">Try again</button></p>
            <p class="switch"><a href="index.html">Go to the login page</a></p>
        </div>
    </main>
</body>
</html>
