<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="A WhatsApp-style messaging app: register, pick a person and chat live.">
    <meta name="theme-color" content="#0b0e14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Chat">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/styles.css">
    <title>Offline - Chat App</title>
</head>
<body class="auth-page">
    <main class="auth-wrap">
        <div class="auth-card">
            <span class="brand-mark" aria-hidden="true">&#128246;</span>
            <h1>You're offline</h1>
            <p class="subtitle">The app could not reach the chat server. Check your connection and try again.</p>
            <p><button type="button" class="submit" onclick="window.location.reload()">Try again</button></p>
            <p class="switch"><a href="index.html">Go to the login page</a></p>
        </div>
    </main>
</body>
</html>
